<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>California Partnerships Map</title>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <style>
      :root {
        --sidebar-width: 420px;
        --gap: 12px;
        --bg: #ffffff;
        --card-bg: #f8f9fb;
        --text: #0f172a;
        --muted: #475569;
        --border: #e2e8f0;
        --accent: #0ea5e9;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        color: var(--text);
        background: var(--bg);
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto,
          Inter, Arial, sans-serif;
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(260px, var(--sidebar-width)) 1fr;
        grid-template-rows: 100vh;
        gap: var(--gap);
        padding: var(--gap);
      }
      .sidebar {
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 12px;
        background: var(--bg);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .sidebar-header {
        padding: 8px 10px 12px 10px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 10px;
      }
      .sidebar h1 {
        font-size: 18px;
        margin: 0 0 4px 0;
      }
      .sidebar .hint {
        font-size: 12px;
        color: var(--muted);
      }
      .search {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      .search input {
        flex: 1;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 10px;
        font-size: 14px;
      }
      .list {
        overflow: auto;
        padding: 6px;
        display: grid;
        gap: 10px;
      }
      .card {
        display: grid;
        grid-template-columns: 88px 1fr;
        gap: 10px;
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--card-bg);
        cursor: pointer;
        transition: box-shadow 0.2s ease, transform 0.06s ease;
      }
      .card:hover {
        box-shadow: 0 6px 18px rgba(2, 6, 23, 0.06);
        transform: translateY(-1px);
      }
      .thumb {
        width: 88px;
        height: 88px;
        border-radius: 10px;
        overflow: hidden;
        background: #e5e7eb;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--border);
        position: relative;
      }
      .thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .meta h3 {
        margin: 0 0 6px 0;
        font-size: 15px;
        line-height: 1.2;
      }
      .meta .story {
        font-size: 13px;
        color: var(--muted);
        line-height: 1.35;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .meta .address {
        font-size: 12px;
        color: #64748b;
        margin-top: 6px;
      }
      .map-wrap {
        position: relative;
        min-height: 0;
        border: 1px solid var(--border);
        border-radius: 16px;
        overflow: clip;
      }
      #map {
        height: 100%;
        min-height: calc(100vh - 2 * var(--gap));
      }
      .loader {
        position: absolute;
        right: 12px;
        top: 12px;
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 6px 10px;
        font-size: 12px;
        color: var(--muted);
        display: none;
        align-items: center;
        gap: 8px;
      }
      .loader.show {
        display: inline-flex;
      }
      .pulse {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: var(--accent);
        position: relative;
        animation: pulse 1.2s infinite ease-in-out;
      }
      @keyframes pulse {
        0% {
          transform: scale(1);
          opacity: 0.9;
        }
        70% {
          transform: scale(1.6);
          opacity: 0.2;
        }
        100% {
          transform: scale(1);
          opacity: 0.9;
        }
      }
      .leaflet-popup-content {
        margin: 8px 12px;
        line-height: 1.3;
      }
      .popup {
  max-width: 240px;

        max-width: 280px;
      }
      .popup .p-photo {
        width: 100%;
        aspect-ratio: 4/3;
        max-height: 140px;
        border-radius: 10px;
        overflow: hidden;
        background: #e5e7eb;
        border: 1px solid var(--border);
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .popup .p-photo img,
      .popup .p-photo iframe {
        width: 100%;
        height: 100%;
        display: block;
        border: 0;
        object-fit: cover;
      }
      .popup .p-title {
  font-weight: 600;
  font-size: 14px;
  margin: 0 0 6px 0;
}
      .popup .p-story {
  font-size: 12px;
  line-height: 1.3;
  color: var(--muted);
}
      .legend {
        position: absolute;
        left: 10px;
        bottom: 10px;
        z-index: 400;
        background: rgba(255, 255, 255, 0.95);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px 10px;
        font-size: 12px;
        color: var(--muted);
      }
      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
        }
        #map {
          min-height: 60vh;
        }
      }
    </style>

      /* ------------- 工具：转义 & Drive 源解析（img / thumbnail / iframe） ------------- */
      function esc(s) {
        return (s || "")
          .toString()
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function extractDriveId(u) {
        if (!u) return "";
        const s = String(u).trim();
        const m1 = s.match(/\/file\/d\/([a-zA-Z0-9_-]{10,})/);
        if (m1) return m1[1];
        try {
          const url = new URL(s);
          const id = url.searchParams.get("id");
          if (id) return id;
        } catch {}
        const m2 = s.match(/[?&]id=([a-zA-Z0-9_-]{10,})/);
        return m2 ? m2[1] : "";
      }

      function driveSrc(u) {
        if (!u || String(u).toLowerCase() === "nan")
          return { img: "", thumb: "", preview: "", id: "" };
        const id = extractDriveId(u);
        if (id) {
          return {
            img: `https://drive.google.com/uc?export=view&id=${id}`,
            thumb: `https://drive.google.com/thumbnail?id=${id}&sz=w1000`,
            preview: `https://drive.google.com/file/d/${id}/preview`,
            id,
          };
        }
        if (/^https?:\/\//i.test(u))
          return { img: u, thumb: "", preview: "", id: "" };
        return { img: "", thumb: "", preview: "", id: "" };
      }

      // 统一处理图片失败：先换 thumbnail，再换 iframe（仅弹窗传了 preview），最后显示占位
      function driveImgError(img) {
        const thumb = img.dataset.thumb || "";
        const preview = img.dataset.preview || "";
        if (!img.dataset.f1 && thumb) {
          img.dataset.f1 = "1";
          img.src = thumb;
          return;
        }
        if (!img.dataset.f2 && preview) {
          img.dataset.f2 = "1";
          const wrap = img.parentNode;
          img.remove();
          const ifr = document.createElement("iframe");
          ifr.src = preview;
          ifr.loading = "lazy";
          ifr.allow = "autoplay";
          ifr.style.width = "100%";
          ifr.style.height = "100%";
          ifr.style.border = "0";
          wrap.appendChild(ifr);
          return;
        }
        img.style.display = "none";
        const w = img.parentNode;
        w.innerHTML = '<div style="font-size:22px;text-align:center">📍</div>';
      }

      /* ----------------- 地图 & UI ----------------- */
      const GEO_KEY = "partnerships_geocache_v1";
      const geoCache = JSON.parse(localStorage.getItem(GEO_KEY) || "{}");
      function saveCache() {
        localStorage.setItem(GEO_KEY, JSON.stringify(geoCache));
      }

      async function geocode(address) {
        if (geoCache[address]) return geoCache[address];
        const url =
          "https://nominatim.openstreetmap.org/search?format=json&q=" +
          encodeURIComponent(address + ", California, USA") +
          "&limit=1&addressdetails=0";
        const resp = await fetch(url, { headers: { "Accept-Language": "en" } });
        if (!resp.ok) throw new Error("Geocoding failed");
        const arr = await resp.json();
        if (arr && arr.length) {
          const lat = parseFloat(arr[0].lat),
            lon = parseFloat(arr[0].lon);
          const res = { lat, lon };
          geoCache[address] = res;
          saveCache();
          return res;
        } else {
          throw new Error("No result");
        }
      }

                          alt="Photo of ${esc(d.partnership)}"
                          loading="lazy" decoding="async"
                          data-thumb="${esc(thumb)}"
                          data-preview=""
                          onerror="driveImgError(this)"/>`
                : ""
            }
            <span class="fallback" style="display:${
              img ? "none" : "inline-block"
            };font-size:22px;">📍</span>
          </div>
          <div class="meta">
            <h3>${esc(d.partnership)}</h3>
            <div class="story">${esc(d.story)}</div>
            ${addr}
          </div>
        </article>
      `;
      }

      function renderList(items) {
        list.innerHTML = items.map((d, i) => cardHTML(d, i)).join("");
        list.querySelectorAll(".card").forEach((el) => {
          el.addEventListener("click", () =>
            focusItem(parseInt(el.dataset.idx, 10))
          );
          el.addEventListener("keypress", (e) => {
            if (e.key === "Enter") focusItem(parseInt(el.dataset.idx, 10));
          });
        });
      }

      function focusItem(i) {
        const m = markers[i];
        if (!m) return;
        map.setView(m.marker.getLatLng(), Math.max(map.getZoom(), 11), {
          animate: true,
        });
        m.marker.openPopup();
      }

      const searchInput = document.getElementById("searchInput");
      searchInput.addEventListener("input", () => {
        const q = searchInput.value.trim().toLowerCase();
        const filtered = DATA.filter((d) => {
          const hay = (
            d.partnership +
            " " +
            d.address +
            " " +
            d.story
          ).toLowerCase();
          return hay.includes(q);
        });
        renderList(filtered);
        list.querySelectorAll(".card").forEach((el, uiIdx) => {
          const filteredIdx = DATA.indexOf(filtered[uiIdx]);
          el.dataset.idx = filteredIdx;
        });
      });

      renderList(DATA);

      const sleep = (ms) => new Promise((res) => setTimeout(res, ms));

      async function initMarkers() {
        setLoading(true);
        for (let i = 0; i < DATA.length; i++) {
          const d = DATA[i];
          try {
            const g = await geocode(d.address);
            const marker = L.marker([g.lat, g.lon]).addTo(map);
            marker.bindPopup(markerPopupHTML(d));
            marker.on("click", () => {
              const cards = list.querySelectorAll(".card");
              const idxInList = Array.from(cards).findIndex(
                (c) => parseInt(c.dataset.idx, 10) === i
              );
              if (idxInList >= 0)
                cards[idxInList].scrollIntoView({
                  behavior: "smooth",
                  block: "center",
                });
            });
            markers[i] = { id: i, marker, data: d };
          } catch (err) {
            console.warn("Geocode failed for", d.address, err);
          }
          await sleep(250);
        }
        setLoading(false);
      }

      initMarkers();
    </script>
  </body>
</html>
